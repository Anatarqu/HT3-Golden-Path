apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: microservicio-nodejs
  title: "Microservicio NodeJS"
  description: "Golden Path para crear un microservicio NodeJS y publicarlo en GitHub."
  tags:
    - nodejs
    - microservicio
    - golden-path

spec:
  owner: group:default/owner
  type: service

  parameters:

    # ================================================================
    # INFORMACIÓN DEL MICROSERVICIO
    # ================================================================

    - title: "Información del Microservicio"
      required:
        - serviceName
        - owner

      properties:

        serviceName:
          title: "Nombre del Microservicio"
          type: string
          description: "Nombre único del microservicio."
          maxLength: 50
          pattern: "^[a-z0-9-]+$"
          ui:autofocus: true
          ui:help: "Ejemplo: prueba-conexion"

        owner:
          title: "Propietario"
          type: string
          description: "Equipo o usuario propietario del servicio."
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User

  # ================================================================
  # STEPS
  # ================================================================

  steps:

    # ================================================================
    # 1. DESCARGAR SKELETON
    # ================================================================

    - id: fetchBase
      name: "Descargar skeleton"
      action: fetch:template

      input:
        url: ./skeleton

        values:
          serviceName: ${{ parameters.serviceName }}
          owner: ${{ parameters.owner }}

    # ================================================================
    # 2. CREAR REPOSITORIO GITHUB
    # ================================================================

    - id: publishGithub
      name: "Crear repositorio en GitHub"
      action: publish:github

      input:
        repoUrl: github.com?owner=Anatarqu&repo=${{ parameters.serviceName }}
        description: "Microservicio ${{ parameters.serviceName }} creado desde Backstage."
        repoVisibility: private
        defaultBranch: main

    # ================================================================
    # 3. REGISTRAR EN BACKSTAGE
    # ================================================================

    - id: registerCatalog
      name: "Registrar componente en Backstage"
      action: catalog:register

      input:
        repoContentsUrl: ${{ steps.publishGithub.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ================================================================
  # OUTPUT
  # ================================================================

  output:

    links:

      - title: "Ver repositorio en GitHub"
        url: ${{ steps.publishGithub.output.remoteUrl }}
        icon: github

      - title: "Ver componente en Backstage"
        entityRef: ${{ steps.registerCatalog.output.entityRef }}
        icon: catalog
