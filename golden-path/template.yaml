# =====================================================================
# TEMPLATE BACKSTAGE - MICROSERVICIO NODEJS
# =====================================================================

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: microservicio-nodejs
  title: "Microservicio NodeJS — Seguro por Defecto"
  description: >
    Golden Path para crear un nuevo microservicio NodeJS con estructura base,
    publicarlo en GitHub y registrarlo en el Software Catalog.
  tags:
    - nodejs
    - microservicio
    - golden-path

spec:
  owner: group:default/platform-engineering
  type: service

  # ================================================================
  # PARAMETERS
  # ================================================================
  parameters:

    - title: "Información del Microservicio"
      required:
        - serviceName
        - owner

      properties:

        serviceName:
          title: "Nombre del Microservicio"
          type: string
          description: >
            Nombre único del microservicio. Debe estar en minúsculas,
            sin espacios ni caracteres especiales. Ejemplo: pagos-service.
          maxLength: 50
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
          ui:help: "Usa minúsculas, números y guiones. Ej: mi-nuevo-servicio"

        owner:
          title: "Propietario (Owner)"
          type: string
          description: >
            Equipo o usuario responsable de este microservicio.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
          ui:help: "Selecciona el equipo o usuario propietario del servicio"

    # ================================================================
    # REPOSITORIO GITHUB
    # ================================================================

    - title: "Repositorio GitHub"
      required:
        - repoUrl

      properties:

        repoUrl:
          title: "Repositorio GitHub"
          type: string
          description: >
            Selecciona la organización o usuario de GitHub y define
            el nombre del repositorio.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # ================================================================
  # STEPS
  # ================================================================
  steps:

    # --------------------------------------------------------------
    # PASO 1 - Descargar skeleton
    # --------------------------------------------------------------

    - id: fetchBase
      name: "Descargar y parametrizar el skeleton"
      action: fetch:template

      input:
        url: ./skeleton

        values:
          serviceName: ${{ parameters.serviceName }}
          owner: ${{ parameters.owner }}

    # --------------------------------------------------------------
    # PASO 2 - PUBLICAR EN GITHUB
    # --------------------------------------------------------------

    - id: publishGithub
      name: "Publicar en GitHub"
      action: publish:github

      input:
        repoUrl: ${{ parameters.repoUrl }}

        description: >
          Microservicio ${{ parameters.serviceName }}
          creado desde Backstage mediante Golden Path.

        repoVisibility: private
        defaultBranch: main

    # --------------------------------------------------------------
    # PASO 3 - REGISTRAR EN BACKSTAGE
    # --------------------------------------------------------------

    - id: registerCatalog
      name: "Registrar en el Software Catalog"
      action: catalog:register

      input:
        repoContentsUrl: ${{ steps.publishGithub.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ================================================================
  # OUTPUT
  # ================================================================
  output:

    links:

      - title: "Ver repositorio en GitHub"
        url: ${{ steps.publishGithub.output.remoteUrl }}
        icon: github

      - title: "Ver en el Software Catalog"
        entityRef: ${{ steps.registerCatalog.output.entityRef }}
        icon: catalog
