apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: microservicio-nodejs
  title: "Microservicio NodeJS"
  description: "Golden Path para crear un microservicio NodeJS y publicarlo en GitHub."
  tags:
    - nodejs
    - microservicio
    - golden-path

spec:
  owner: group:default/owner
  type: service

  parameters:

    # ================================================================
    # INFORMACIÓN DEL MICROSERVICIO
    # ================================================================

    - title: "Información del Microservicio"
      description: "Datos básicos del nuevo microservicio."

      required:
        - serviceName
        - owner

      properties:

        serviceName:
          title: "Nombre del Microservicio"
          type: string
          description: >
            Nombre único del microservicio.
            Usa minúsculas, números y guiones.
          maxLength: 50
          pattern: "^[a-z0-9-]+$"
          ui:autofocus: true
          ui:help: "Ejemplo: pagos-service"

        owner:
          title: "Propietario"
          type: string
          description: "Equipo o usuario responsable del microservicio."
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User

    # ================================================================
    # REPOSITORIO GITHUB
    # ================================================================

    - title: "Repositorio GitHub"
      description: "Selecciona dónde se publicará el microservicio."

      required:
        - repoUrl

      properties:

        repoUrl:
          title: "Repositorio"
          type: string
          description: "Repositorio GitHub donde se publicará el código."

          ui:field: RepoUrlPicker

          ui:options:
            allowedHosts:
              - github.com

            allowedOwners:
              - Anatarqu

  # ================================================================
  # STEPS
  # ================================================================

  steps:

    # ================================================================
    # PASO 1 - GENERAR SKELETON
    # ================================================================

    - id: fetchBase
      name: "Descargar skeleton"
      action: fetch:template

      input:
        url: ./skeleton

        values:
          serviceName: ${{ parameters.serviceName }}
          owner: ${{ parameters.owner }}

    # ================================================================
    # PASO 2 - CREAR/PUBLICAR REPOSITORIO
    # ================================================================

    - id: publishGithub
      name: "Crear repositorio en GitHub"
      action: publish:github

      input:
        repoUrl: ${{ parameters.repoUrl }}

        description: "Microservicio ${{ parameters.serviceName }} creado desde Backstage."

        repoVisibility: private

        defaultBranch: main

    # ================================================================
    # PASO 3 - REGISTRAR COMPONENTE
    # ================================================================

    - id: registerCatalog
      name: "Registrar componente en Backstage"
      action: catalog:register

      input:
        repoContentsUrl: ${{ steps.publishGithub.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ================================================================
  # OUTPUT
  # ================================================================

  output:

    links:

      - title: "Ver repositorio en GitHub"
        url: ${{ steps.publishGithub.output.remoteUrl }}
        icon: github

      - title: "Ver componente en Backstage"
        entityRef: ${{ steps.registerCatalog.output.entityRef }}
        icon: catalog
