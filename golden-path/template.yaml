# =====================================================================
# TEMPLATE BACKSTAGE - MICROSERVICIO NODEJS
# =====================================================================

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: microservicio-nodejs
  title: "Microservicio NodeJS — Seguro por Defecto"
  description: "Golden Path para crear un nuevo microservicio NodeJS, publicarlo en GitHub y registrarlo en Backstage."
  tags:
    - nodejs
    - microservicio
    - golden-path

spec:
  owner: user:default/guest
  type: service

  # ===================================================================
  # PARAMETERS
  # ===================================================================

  parameters:

    - title: "Información del Microservicio"
      required:
        - serviceName
        - owner

      properties:

        serviceName:
          title: "Nombre del Microservicio"
          type: string
          description: "Nombre único del microservicio."
          maxLength: 50
          pattern: "^[a-z0-9-]+$"
          ui:autofocus: true
          ui:help: "Usa minúsculas, números y guiones. Ej: prueba-conexion"

        owner:
          title: "Propietario"
          type: string
          description: "Usuario o equipo responsable del microservicio."
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User

    # =================================================================
    # REPOSITORIO GITHUB
    # =================================================================

    - title: "Repositorio GitHub"
      required:
        - repoUrl

      properties:

        repoUrl:
          title: "Repositorio GitHub"
          type: string
          description: "Selecciona dónde crear el repositorio."
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # ===================================================================
  # STEPS
  # ===================================================================

  steps:

    # -----------------------------------------------------------------
    # 1. DESCARGAR SKELETON
    # -----------------------------------------------------------------

    - id: fetchBase
      name: "Descargar skeleton"
      action: fetch:template

      input:
        url: ./skeleton

        values:
          serviceName: ${{ parameters.serviceName }}
          owner: ${{ parameters.owner }}

    # -----------------------------------------------------------------
    # 2. PUBLICAR EN GITHUB
    # -----------------------------------------------------------------

    - id: publishGithub
      name: "Crear repositorio en GitHub"
      action: publish:github

      input:
        repoUrl: ${{ parameters.repoUrl }}

        description: "Microservicio ${{ parameters.serviceName }} creado desde Backstage."

        repoVisibility: private

        defaultBranch: main

    # -----------------------------------------------------------------
    # 3. REGISTRAR EN BACKSTAGE
    # -----------------------------------------------------------------

    - id: registerCatalog
      name: "Registrar componente en Backstage"
      action: catalog:register

      input:
        repoContentsUrl: ${{ steps.publishGithub.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ===================================================================
  # OUTPUT
  # ===================================================================

  output:

    links:

      - title: "Repositorio GitHub"
        url: ${{ steps.publishGithub.output.remoteUrl }}
        icon: github

      - title: "Componente en Backstage"
        entityRef: ${{ steps.registerCatalog.output.entityRef }}
        icon: catalog
